<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Formulario de Rol', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-user-shield text-primary me-2"></i>
                    <span th:text="${rol.id == null ? 'Registrar Nuevo Rol' : 'Editar Rol'}"></span>
                </h3>
                <p class="text-muted mb-0">Configura los roles y niveles de acceso dentro del sistema.</p>
            </div>
            <a th:href="@{/roles}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/roles/guardar}" th:object="${rol}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-4">
                    <label for="nombre" class="form-label fw-bold text-secondary">
                        <i class="fa-solid fa-id-badge text-primary me-1"></i> Nombre del Rol
                    </label>
                    <input type="text" class="form-control form-control-lg fs-6" id="nombre" th:field="*{nombre}"
                           placeholder="Ej. ADMINISTRADOR, MEDICO, RECEPCIONISTA" required />
                </div>

                <div class="mb-4 form-check form-switch bg-light p-3 rounded border">
                    <input type="checkbox" class="form-check-input ms-0 me-2"
                           th:checked="${rol.estado == null or rol.estado}"
                           name="estado" id="estadoSwitch" style="transform: scale(1.3);" />
                    <label class="form-check-label fw-bold text-dark" for="estadoSwitch">Rol Activo en el Sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/roles}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Rol
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
