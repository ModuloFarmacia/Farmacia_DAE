<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Roles', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-user-shield text-info me-2"></i>Gestión de Roles
                </h3>
                <p class="text-muted mb-0">Define y administra los niveles de acceso y permisos del sistema.</p>
            </div>
            <a th:href="@{/roles/nuevo}" class="btn btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-shield-plus me-1"></i> + Nuevo Rol
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nombre del Rol</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${roles}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${'#' + r.id}"></td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2 fs-6"
                                  th:classappend="${r.nombre == 'ADMINISTRADOR' ? 'bg-primary' : (r.nombre == 'MEDICO' ? 'bg-success' : 'bg-warning text-dark')}"
                                  th:text="${r.nombre}">
                            </span>
                        </td>
                        <td>
                            <span th:if="${r.estado == null or r.estado}" class="badge bg-success-subtle text-success border border-success px-3 py-1 rounded-pill">
                                <i class="fa-solid fa-circle-check me-1"></i> Activo
                            </span>
                            <span th:if="${r.estado != null and !r.estado}" class="badge bg-danger-subtle text-danger border border-danger px-3 py-1 rounded-pill">
                                <i class="fa-solid fa-circle-xmark me-1"></i> Inactivo
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/roles/editar/{id}(id=${r.id})}" class="btn btn-outline-primary btn-sm me-1" title="Editar">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>

                            <a th:href="@{/roles/cambiar-estado/{id}(id=${r.id})}"
                               class="btn btn-sm"
                               th:classappend="${r.estado == null or r.estado ? 'btn-outline-danger' : 'btn-outline-success'}">
                                <i class="fa-solid" th:classappend="${r.estado == null or r.estado ? 'fa-ban' : 'fa-check'}"></i>
                                <span th:text="${r.estado == null or r.estado ? ' Desactivar' : ' Activar'}"></span>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="4" class="text-center text-muted py-4">No hay roles registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
