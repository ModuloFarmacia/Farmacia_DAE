<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Lote', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-boxes-stacked text-success me-2"></i>
                    <span th:text="${lote.id == null ? 'Registrar Ingreso de Lote' : 'Editar Lote'}"></span>
                </h3>
                <p class="text-muted mb-0">Control de inventario, proveedores y caducidad de productos.</p>
            </div>
            <a th:href="@{/lotes}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/lotes/guardar}" th:object="${lote}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-barcode text-primary me-1"></i> Número de Lote
                        </label>
                        <input type="text" class="form-control" th:field="*{numeroLote}" placeholder="Ej. LOT-2026-001" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-capsules text-primary me-1"></i> Medicamento
                        </label>
                        <select class="form-select" th:field="*{medicamento.id}" required>
                            <option value="">-- Seleccionar Medicamento --</option>
                            <option th:each="m : ${medicamentos}"
                                    th:value="${m.id}"
                                    th:text="${m.nombreComercial + (m.concentracion != null ? ' (' + m.concentracion + ')' : '')}"
                                    th:selected="${lote.medicamento != null and lote.medicamento.id == m.id}"></option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-truck-field text-primary me-1"></i> Proveedor
                        </label>
                        <select class="form-select" th:field="*{proveedor}" required>
                            <option value="">-- Seleccionar Proveedor --</option>
                            <option th:each="p : ${proveedores}"
                                    th:value="${p.razonSocial}"
                                    th:text="${p.razonSocial}"
                                    th:selected="${lote.proveedor == p.razonSocial}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-cubes text-primary me-1"></i> Cantidad
                        </label>
                        <input type="number" class="form-control" th:field="*{cantidad}" placeholder="Ej. 100" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-money-bill-wave text-primary me-1"></i> Costo Unitario (S/)
                        </label>
                        <input type="number" step="0.01" class="form-control" th:field="*{costoUnitario}" placeholder="0.00" />
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-calendar-plus text-primary me-1"></i> Fecha de Ingreso
                        </label>
                        <input type="date" class="form-control" th:field="*{fechaIngreso}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-calendar-xmark text-danger me-1"></i> Fecha de Vencimiento
                        </label>
                        <input type="date" class="form-control" th:field="*{fechaVencimiento}" required />
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/lotes}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Lote
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
