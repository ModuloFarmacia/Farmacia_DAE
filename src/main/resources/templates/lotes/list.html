<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Control de Lotes y Stock', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-boxes-stacked text-success me-2"></i>Control de Lotes y Stock
                </h3>
                <p class="text-muted mb-0">Seguimiento de inventario, ingresos, fechas de vencimiento y proveedores.</p>
            </div>
            <a th:href="@{/lotes/nuevo}" class="btn btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> Registrar Ingreso de Lote
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">N° Lote</th>
                        <th>Medicamento</th>
                        <th>Proveedor</th>
                        <th>Cantidad</th>
                        <th>Costo Unit.</th>
                        <th>F. Ingreso</th>
                        <th>F. Vencimiento</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${lotes}">
                        <td class="ps-4 fw-bold text-primary" th:text="${l.numeroLote}"></td>
                        <td>
                            <div class="fw-bold text-dark"
                                 th:text="${l.medicamento != null ? l.medicamento.nombreComercial : 'SIN MEDICAMENTO'}"></div>
                        </td>
                        <td th:text="${l.proveedor != null ? l.proveedor : 'SIN PROVEEDOR'}"></td>
                        <td>
                            <span class="badge bg-secondary px-3 py-1 rounded-pill" th:text="${l.cantidad}"></span>
                        </td>
                        <td th:text="${l.costoUnitario != null ? 'S/ ' + #numbers.formatDecimal(l.costoUnitario, 1, 'POINT', 2, 'POINT') : 'S/ 0.00'}"></td>
                        <td th:text="${l.fechaIngreso != null ? l.fechaIngreso : '-'}"></td>
                        <td th:text="${l.fechaVencimiento != null ? l.fechaVencimiento : '-'}"></td>
                        <td class="text-end pe-4 text-nowrap">
                            <a th:href="@{/lotes/editar/{id}(id=${l.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Editar
                            </a>
                            <a th:href="@{/lotes/desactivar/{id}(id=${l.id})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('¿Está seguro de desactivar/eliminar este lote?');">
                                <i class="fa-solid fa-ban me-1"></i> Desactivar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lotes)}">
                        <td colspan="8" class="text-center text-muted py-4">No hay lotes registrados en el inventario.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
