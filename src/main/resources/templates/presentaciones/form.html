<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Presentación', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-box-archive text-info me-2"></i>
                    <span th:text="${presentacion.id == null ? 'Registrar Nueva Presentación' : 'Editar Presentación'}"></span>
                </h3>
                <p class="text-muted mb-0">Definición de empaques, dosis y formatos comerciales.</p>
            </div>
            <a th:href="@{/presentaciones}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/presentaciones/guardar}" th:object="${presentacion}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-box text-primary me-1"></i> Nombre de la Presentación
                        </label>
                        <input type="text" class="form-control" th:field="*{nombre}"
                               placeholder="Ej. Jarabe 250ml, Caja x 100 Pastillas, Ampolla 5ml" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-capsules text-primary me-1"></i> Medicamento
                        </label>
                        <select class="form-select" th:field="*{medicamento.id}" required>
                            <option value="">-- Seleccionar Medicamento --</option>
                            <option th:each="m : ${medicamentos}"
                                    th:value="${m.id}"
                                    th:text="${m.nombreComercial + (m.concentracion != null ? ' (' + m.concentracion + ')' : '')}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">
                        <i class="fa-solid fa-align-left text-primary me-1"></i> Descripción
                    </label>
                    <textarea class="form-control" th:field="*{descripcion}" rows="2" placeholder="Detalles breves de empaque o dosificación..."></textarea>
                </div>

                <div class="mb-4 form-check form-switch bg-light p-3 rounded border">
                    <input type="checkbox" class="form-check-input ms-0 me-2"
                           th:checked="${presentacion.estado == null or presentacion.estado}"
                           name="estado" id="estadoSwitch" style="transform: scale(1.3);" />
                    <label class="form-check-label fw-bold text-dark" for="estadoSwitch">Presentación Activa en el Sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/presentaciones}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Presentación
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
