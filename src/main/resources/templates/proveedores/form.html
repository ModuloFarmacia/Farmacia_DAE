<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Proveedor', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-truck-field text-warning me-2"></i>
                    <span th:text="${proveedor.id == null ? 'Registrar Nuevo Proveedor' : 'Editar Proveedor'}"></span>
                </h3>
                <p class="text-muted mb-0">Directorio de distribuidoras y laboratorios de fármacos.</p>
            </div>
            <a th:href="@{/proveedores}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-building text-primary me-1"></i> Razón Social
                        </label>
                        <input type="text" class="form-control" th:field="*{razonSocial}" placeholder="Ej. Droguería Suiza S.A.C." required />
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-id-card text-primary me-1"></i> RUC
                        </label>
                        <input type="text" class="form-control" th:field="*{ruc}" maxlength="11" placeholder="20123456789" />
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-user text-primary me-1"></i> Persona de Contacto
                        </label>
                        <input type="text" class="form-control" th:field="*{contacto}" placeholder="Ej. Juan Pérez" />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-phone text-primary me-1"></i> Teléfono
                        </label>
                        <input type="text" class="form-control" th:field="*{telefono}" placeholder="987654321" />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-envelope text-primary me-1"></i> Correo Electrónico
                        </label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="ventas@proveedor.com" />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">
                        <i class="fa-solid fa-location-dot text-primary me-1"></i> Dirección Fiscal
                    </label>
                    <input type="text" class="form-control" th:field="*{direccion}" placeholder="Av. Los Pinos 123 - Lima" />
                </div>

                <div class="mb-4 form-check form-switch bg-light p-3 rounded border">
                    <input type="checkbox" class="form-check-input ms-0 me-2"
                           th:checked="${proveedor.estado == null or proveedor.estado}"
                           name="estado" id="estadoSwitch" style="transform: scale(1.3);" />
                    <label class="form-check-label fw-bold text-dark" for="estadoSwitch">Proveedor Activo en el Sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/proveedores}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Proveedor
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
