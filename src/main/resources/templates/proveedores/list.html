<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Proveedores', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-truck-field text-primary me-2"></i>Gestión de Proveedores
                </h3>
                <p class="text-muted mb-0">Directorio de distribuidoras y droguerías de medicamentos.</p>
            </div>
            <a th:href="@{/proveedores/nuevo}" class="btn btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> + Nuevo Proveedor
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Razón Social / RUC</th>
                        <th>Contacto / Teléfono</th>
                        <th>Email / Dirección</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${proveedores}">
                        <td class="ps-4 fw-bold" th:text="${'#' + p.id}"></td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${p.razonSocial}"></div>
                            <small class="text-muted" th:text="${'RUC: ' + (p.ruc != null ? p.ruc : '-')}"></small>
                        </td>
                        <td>
                            <div th:text="${p.contacto != null ? p.contacto : '-'}"></div>
                            <small class="text-muted" th:text="${p.telefono != null ? p.telefono : '-'}"></small>
                        </td>
                        <td>
                            <div th:text="${p.email != null ? p.email : '-'}"></div>
                            <small class="text-muted" th:text="${p.direccion != null ? p.direccion : '-'}"></small>
                        </td>
                        <td>
                            <span class="badge px-3 py-1 rounded-pill"
                                  th:classappend="${p.estado} ? 'bg-success-subtle text-success border border-success' : 'bg-danger-subtle text-danger border border-danger'"
                                  th:text="${p.estado} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/proveedores/editar/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-pen-to-square me-1"></i> Editar
                                </a>
                                <a th:href="@{/proveedores/cambiar-estado/{id}(id=${p.id})}"
                                   th:classappend="${p.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                                   class="btn btn-sm">
                                    <i class="fa-solid" th:classappend="${p.estado} ? 'fa-ban' : 'fa-check'"></i>
                                    <span th:text="${p.estado} ? ' Desactivar' : ' Activar'"></span>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(proveedores)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay proveedores registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
