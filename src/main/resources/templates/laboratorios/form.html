<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Laboratorio', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-flask text-danger me-2"></i>
                    <span th:text="${laboratorio.id == null ? 'Registrar Nuevo Laboratorio' : 'Editar Laboratorio'}"></span>
                </h3>
                <p class="text-muted mb-0">Directorio de empresas laboratorios fabricantes de medicamentos.</p>
            </div>
            <a th:href="@{/laboratorios}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/laboratorios/guardar}" th:object="${laboratorio}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-barcode text-primary me-1"></i> Código
                        </label>
                        <input type="text" class="form-control" th:field="*{codigo}" placeholder="Ej. LAB-001" />
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-building text-primary me-1"></i> Razón Social
                        </label>
                        <input type="text" class="form-control" th:field="*{razonSocial}" placeholder="Ej. Laboratorios Bayer S.A." required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-id-card text-primary me-1"></i> RUC
                        </label>
                        <input type="text" class="form-control" th:field="*{ruc}" maxlength="11" placeholder="20123456789" />
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-phone text-primary me-1"></i> Teléfono
                        </label>
                        <input type="text" class="form-control" th:field="*{telefono}" placeholder="Ej. 01 4567890" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-envelope text-primary me-1"></i> Correo Electrónico
                        </label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="contacto@laboratorio.com" />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">
                        <i class="fa-solid fa-location-dot text-primary me-1"></i> Dirección
                    </label>
                    <input type="text" class="form-control" th:field="*{direccion}" placeholder="Ej. Av. Primavera 123 - Lima" />
                </div>

                <div class="mb-4 form-check form-switch bg-light p-3 rounded border">
                    <input type="checkbox" class="form-check-input ms-0 me-2"
                           th:checked="${laboratorio.estado == null or laboratorio.estado}"
                           name="estado" id="estadoSwitch" style="transform: scale(1.3);" />
                    <label class="form-check-label fw-bold text-dark" for="estadoSwitch">Laboratorio Activo en el Sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/laboratorios}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Laboratorio
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
