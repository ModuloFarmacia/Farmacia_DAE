<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Laboratorios', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-flask text-danger me-2"></i>Gestión de Laboratorios
                </h3>
                <p class="text-muted mb-0">Directorio de empresas laboratorios fabricantes de medicamentos.</p>
            </div>
            <a th:href="@{/laboratorios/nuevo}" class="btn btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> Nuevo Laboratorio
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Código</th>
                        <th>Razón Social / RUC</th>
                        <th>Teléfono / Email</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${laboratorios}">
                        <td class="ps-4 fw-bold text-primary" th:text="${l.codigo}"></td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${l.razonSocial}"></div>
                            <small class="text-muted" th:text="${'RUC: ' + (l.ruc != null ? l.ruc : '-')}"></small>
                        </td>
                        <td>
                            <div th:text="${l.telefono != null ? l.telefono : '-'}"></div>
                            <small class="text-muted" th:text="${l.email != null ? l.email : '-'}"></small>
                        </td>
                        <td th:text="${l.direccion != null ? l.direccion : '-'}"></td>
                        <td>
                            <span class="badge px-3 py-1 rounded-pill"
                                  th:classappend="${l.estado} ? 'bg-success-subtle text-success border border-success' : 'bg-danger-subtle text-danger border border-danger'"
                                  th:text="${l.estado} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/laboratorios/editar/{id}(id=${l.id})}" class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-pen-to-square me-1"></i> Editar
                                </a>
                                <a th:href="@{/laboratorios/cambiar-estado/{id}(id=${l.id})}"
                                   th:classappend="${l.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                                   class="btn btn-sm">
                                    <i class="fa-solid" th:classappend="${l.estado} ? 'fa-ban' : 'fa-check'"></i>
                                    <span th:text="${l.estado} ? ' Desactivar' : ' Activar'"></span>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(laboratorios)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay laboratorios registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
