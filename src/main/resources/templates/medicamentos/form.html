<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Medicamento', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-capsules text-warning me-2"></i>
                    <span th:text="${medicamento.id == null ? 'Registrar Nuevo Medicamento' : 'Editar Medicamento'}"></span>
                </h3>
                <p class="text-muted mb-0">Catálogo general y especificaciones técnicas de medicamentos.</p>
            </div>
            <a th:href="@{/medicamentos}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-barcode text-primary me-1"></i> Código
                        </label>
                        <input type="text" class="form-control" th:field="*{codigo}" placeholder="Ej. MED-001" required />
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-capsules text-primary me-1"></i> Nombre Comercial
                        </label>
                        <input type="text" class="form-control" th:field="*{nombreComercial}" placeholder="Ej. Panadol Forte 500mg" required />
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-vial text-primary me-1"></i> Concentración
                        </label>
                        <input type="text" class="form-control" th:field="*{concentracion}" placeholder="Ej. 500 mg / 5ml" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-tablets text-primary me-1"></i> Forma Farmacéutica
                        </label>
                        <input type="text" class="form-control" th:field="*{formaFarmaceutica}" placeholder="Ej. Tableta, Jarabe, Ampolla" />
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-tags text-primary me-1"></i> Categoría
                        </label>
                        <select class="form-select" th:field="*{categoria.id}" required>
                            <option value="">-- Seleccionar Categoría --</option>
                            <option th:each="c : ${categorias}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-flask text-primary me-1"></i> Laboratorio
                        </label>
                        <select class="form-select" th:field="*{laboratorio.id}" required>
                            <option value="">-- Seleccionar Laboratorio --</option>
                            <option th:each="l : ${laboratorios}"
                                    th:value="${l.id}"
                                    th:text="${l.razonSocial}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 form-check form-switch bg-light p-3 rounded border">
                    <input type="checkbox" class="form-check-input ms-0 me-2"
                           th:checked="${medicamento.estado == null or medicamento.estado}"
                           name="estado" id="estadoSwitch" style="transform: scale(1.3);" />
                    <label class="form-check-label fw-bold text-dark" for="estadoSwitch">Medicamento Habilitado en Sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/medicamentos}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Medicamento
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
