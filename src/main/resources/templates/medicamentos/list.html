<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Catálogo de Medicamentos', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-capsules text-warning me-2"></i>Catálogo de Medicamentos
                </h3>
                <p class="text-muted mb-0">Gestión general del catálogo de medicamentos, principios y especificaciones.</p>
            </div>
            <a th:href="@{/medicamentos/nuevo}" class="btn btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> + Nuevo Medicamento
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Código</th>
                        <th>Nombre Comercial</th>
                        <th>Concentración</th>
                        <th>Forma Farmacéutica</th>
                        <th>Categoría</th>
                        <th>Laboratorio</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${medicamentos}">
                        <td class="ps-4 fw-bold text-primary" th:text="${m.codigo}"></td>
                        <td class="fw-bold text-dark" th:text="${m.nombreComercial}"></td>
                        <td th:text="${m.concentracion != null ? m.concentracion : '-'}"></td>
                        <td th:text="${m.formaFarmaceutica != null ? m.formaFarmaceutica : '-'}"></td>
                        <td>
                            <span class="badge bg-info text-dark px-3 py-1 rounded-pill"
                                  th:text="${m.categoria != null ? m.categoria.nombre : 'SIN CATEGORÍA'}"></span>
                        </td>
                        <td th:text="${m.laboratorio != null ? m.laboratorio.razonSocial : 'SIN LABORATORIO'}"></td>
                        <td>
                            <span class="badge px-3 py-1 rounded-pill"
                                  th:classappend="${m.estado} ? 'bg-success-subtle text-success border border-success' : 'bg-danger-subtle text-danger border border-danger'"
                                  th:text="${m.estado} ? 'Habilitado' : 'Deshabilitado'"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/medicamentos/editar/{id}(id=${m.id})}" class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-pen-to-square me-1"></i> Editar
                                </a>
                                <a th:href="@{/medicamentos/cambiar-estado/{id}(id=${m.id})}"
                                   th:classappend="${m.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                                   class="btn btn-sm">
                                    <i class="fa-solid" th:classappend="${m.estado} ? 'fa-ban' : 'fa-check'"></i>
                                    <span th:text="${m.estado} ? ' Desactivar' : ' Activar'"></span>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(medicamentos)}">
                        <td colspan="8" class="text-center text-muted py-4">No hay medicamentos registrados en el sistema.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
