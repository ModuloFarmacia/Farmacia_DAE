<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema | Farmacia Tecsup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            background: #ffffff;
        }
    </style>
</head>
<body>

<div class="login-card p-4 p-sm-5">
    <div class="text-center mb-4">
        <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-2">
            <i class="fa-solid fa-prescription-bottle-medical fa-2x"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Farmacia Tecsup</h3>
        <p class="text-muted fs-7">Ingrese sus credenciales para acceder</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 fs-6 text-center" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> Usuario o clave incorrectos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success py-2 fs-6 text-center" role="alert">
        <i class="fa-solid fa-circle-check me-1"></i> Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Usuario</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Nombre de usuario" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-secondary">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-bold rounded-3 shadow-sm">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Iniciar Sesión
        </button>
    </form>
</div>

</body>
</html>
