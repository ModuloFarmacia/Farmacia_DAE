<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Formulario de Usuario', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-user-plus text-primary me-2"></i>
                    <span th:text="${usuario.id == null ? 'Registrar Nuevo Usuario' : 'Editar Datos de Usuario'}"></span>
                </h3>
                <p class="text-muted mb-0">Gestiona las credenciales y el nivel de acceso del usuario en el sistema.</p>
            </div>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary px-3 shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Lista
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-id-card text-primary me-1"></i> Nombre Completo
                        </label>
                        <input type="text" class="form-control" th:field="*{nombreCompleto}" placeholder="Ej. Dr. Juan Pérez" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-user text-primary me-1"></i> Usuario (Username)
                        </label>
                        <input type="text" class="form-control" th:field="*{username}" placeholder="Ej. jperez" required />
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-lock text-primary me-1"></i> Contraseña
                        </label>
                        <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" />
                        <small class="text-muted" th:if="${usuario.id != null}">Dejar en blanco si no se desea modificar.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary">
                            <i class="fa-solid fa-user-gear text-primary me-1"></i> Asignar Rol
                        </label>
                        <select class="form-select" th:field="*{rol.id}" required>
                            <option value="">-- Seleccione un Rol del Sistema --</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r.id}"
                                    th:text="${r.nombre}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 form-check form-switch bg-light p-3 rounded border">
                    <input type="checkbox" class="form-check-input ms-0 me-2"
                           th:checked="${usuario.estado == null or usuario.estado}"
                           name="estado" id="estadoSwitch" style="transform: scale(1.3);" />
                    <label class="form-check-label fw-bold text-dark" for="estadoSwitch">Usuario Activo en el Sistema</label>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/usuarios}" class="btn btn-light fs-6 border px-4">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary fs-6 px-4 shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
