<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Gestión de Usuarios', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-users text-primary me-2"></i>Gestión de Usuarios
                </h3>
                <p class="text-muted mb-0">Administra los accesos y roles del personal clínico y de farmacia.</p>
            </div>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-user-plus me-1"></i> Nuevo Usuario
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nombre Completo</th>
                        <th>Usuario</th>
                        <th>Rol Asignado</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td class="ps-4 fw-bold" th:text="${'#' + u.id}"></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-primary-subtle text-primary p-2 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <span class="fw-bold text-dark" th:text="${u.nombreCompleto}"></span>
                            </div>
                        </td>
                        <td th:text="${u.username}"></td>
                        <td>
                            <span class="badge bg-primary px-3 py-2 rounded-pill" th:text="${u.rol != null ? u.rol.nombre : 'SIN ROL'}"></span>
                        </td>
                        <td>
                            <span class="badge px-3 py-1 rounded-pill"
                                  th:classappend="${u.estado} ? 'bg-success-subtle text-success border border-success' : 'bg-danger-subtle text-danger border border-danger'"
                                  th:text="${u.estado} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="fa-solid fa-pen me-1"></i> Editar
                            </a>
                            <a th:href="@{/usuarios/cambiar-estado/{id}(id=${u.id})}"
                               th:classappend="${u.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                               class="btn btn-sm">
                                <i class="fa-solid" th:classappend="${u.estado} ? 'fa-user-slash' : 'fa-user-check'"></i>
                                <span th:text="${u.estado} ? ' Desactivar' : ' Activar'"></span>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
