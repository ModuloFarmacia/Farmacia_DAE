<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Bitácora de Auditoría', ~{::section})}">
<body>

<section>
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-clipboard-list text-primary me-2"></i>Bitácora de Auditoría
                </h3>
                <p class="text-muted mb-0">Seguimiento automático de registros, modificaciones y eliminaciones en el sistema.</p>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Usuario</th>
                        <th>Operación</th>
                        <th>Entidad Afectada</th>
                        <th>ID Registro</th>
                        <th>Fecha y Hora</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${auditorias}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${'#' + a.id}"></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                                    <i class="fa-solid fa-user small"></i>
                                </div>
                                <span class="fw-bold text-dark" th:text="${a.usuario != null ? a.usuario : 'SISTEMA'}"></span>
                            </div>
                        </td>
                        <td>
                            <span class="badge px-3 py-1 rounded-pill"
                                  th:classappend="${a.operacion == 'CREAR' ? 'bg-success' : (a.operacion == 'EDITAR' ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${a.operacion}"></span>
                        </td>
                        <td class="fw-semibold text-secondary" th:text="${a.entidadAfectada}"></td>
                        <td th:text="${a.registroId != null ? a.registroId : '-'}"></td>
                        <td th:text="${a.fechaHora != null ? #temporals.format(a.fechaHora, 'dd/MM/yyyy HH:mm:ss') : '-'}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(auditorias)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay registros registrados en la bitácora de auditoría.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</body>
</html>
